<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Size Checker</title>
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
</head>
<body>
<main>
  <header>
    <h1>PDF Size Checker</h1>
    <p>Find out the page dimensions of any PDF.</p>
  </header>

  <button id="drop" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 17v-6"/><path d="m9 14 3-3 3 3"/>
    </svg>
    <span class="title">Drop a PDF here or click to choose</span>
    <span class="hint">Your file stays on your device. Nothing is uploaded.</span>
  </button>
  <input type="file" id="file" accept="application/pdf,.pdf" multiple>

  <div class="toolbar" id="toolbar" hidden>
    <div class="seg" role="group" aria-label="Units" id="units">
      <button data-unit="mm">mm</button>
      <button data-unit="cm">cm</button>
      <button data-unit="in">in</button>
      <button data-unit="pt">pt</button>
      <button data-unit="px">px</button>
    </div>
  </div>

  <div id="results" aria-live="polite"></div>

  <footer>Sizes are measured as each page appears on screen, including rotation.</footer>
</main>

</body>
</html>
